<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Foreground layer for Realm's Edge adaptive icon.
  Safe zone: content kept within ~66% of canvas (roughly x=76..380, y=76..380)
  to survive circular / squircle masking on all Android launchers.
-->
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Primary gold gradient -->
    <linearGradient id="goldMain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FFF0A0"/>
      <stop offset="30%"  stop-color="#F5D98B"/>
      <stop offset="60%"  stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#7A5A10"/>
    </linearGradient>

    <!-- Blade gradient - silver steel -->
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#9EB8C8"/>
      <stop offset="45%"  stop-color="#E8F0F5"/>
      <stop offset="55%"  stop-color="#D0DDE5"/>
      <stop offset="100%" stop-color="#7A96A8"/>
    </linearGradient>

    <!-- Jewel red gradient -->
    <radialGradient id="gemRed" cx="35%" cy="30%" r="65%">
      <stop offset="0%"   stop-color="#FF9090"/>
      <stop offset="50%"  stop-color="#CC2020"/>
      <stop offset="100%" stop-color="#6B0000"/>
    </radialGradient>

    <!-- Glow filter for the sword -->
    <filter id="swordGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Subtle drop shadow -->
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Gold glow -->
    <filter id="goldGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ═══════════════════════════════════════════
       CROWN  (top, centred around x=228, top ~y=88)
       ═══════════════════════════════════════════ -->
  <g filter="url(#shadow)">
    <!-- Crown base band -->
    <rect x="158" y="165" width="140" height="22" rx="3"
          fill="url(#goldMain)"/>

    <!-- Crown points — 5 peaks -->
    <!-- Left outer -->
    <polygon points="158,165 170,165 165,118"   fill="url(#goldMain)"/>
    <!-- Left inner -->
    <polygon points="178,165 196,165 187,135"   fill="url(#goldMain)"/>
    <!-- Centre (tallest) -->
    <polygon points="210,165 246,165 228,108"   fill="url(#goldMain)"/>
    <!-- Right inner -->
    <polygon points="260,165 278,165 269,135"   fill="url(#goldMain)"/>
    <!-- Right outer -->
    <polygon points="286,165 298,165 291,118"   fill="url(#goldMain)"/>

    <!-- Crown highlight edge -->
    <rect x="158" y="163" width="140" height="3" rx="1" fill="#FFF0A0" opacity="0.6"/>

    <!-- Jewels on crown band -->
    <!-- Centre ruby -->
    <ellipse cx="228" cy="176" rx="10" ry="8" fill="url(#gemRed)"/>
    <ellipse cx="225" cy="173" rx="3"  ry="2" fill="#FF9090" opacity="0.7"/>
    <!-- Left sapphire -->
    <ellipse cx="190" cy="176" rx="7" ry="6" fill="#1A40CC"/>
    <ellipse cx="188" cy="174" rx="2" ry="1.5" fill="#7090FF" opacity="0.7"/>
    <!-- Right emerald -->
    <ellipse cx="266" cy="176" rx="7" ry="6" fill="#0E7A2A"/>
    <ellipse cx="264" cy="174" rx="2" ry="1.5" fill="#40CC60" opacity="0.7"/>

    <!-- Tip orbs on crown points -->
    <circle cx="165" cy="117" r="5" fill="url(#gemRed)"/>
    <circle cx="187" cy="134" r="4" fill="#1A40CC"/>
    <circle cx="228" cy="107" r="6" fill="url(#gemRed)"/>
    <circle cx="269" cy="134" r="4" fill="#0E7A2A"/>
    <circle cx="291" cy="117" r="5" fill="url(#gemRed)"/>
  </g>

  <!-- ═══════════════════════════════════════════
       SWORD  (vertical, centred x=228)
       Pommel ~y=380, cross-guard ~y=245, tip ~y=100 ... 
       shifted down so crown sits above guard
       ═══════════════════════════════════════════ -->

  <!-- Blade -->
  <g filter="url(#shadow)">
    <!-- Main blade body, tapers to tip -->
    <polygon points="220,248  236,248  231,185  225,185"
             fill="url(#bladeGrad)"/>
    <!-- Blade highlight - left edge -->
    <polygon points="220,248 223,248 225,185 223,185"
             fill="#E8F0F5" opacity="0.5"/>

    <!-- Cross-guard -->
    <rect x="148" y="242" width="160" height="18" rx="4"
          fill="url(#goldMain)"/>
    <!-- Guard details -->
    <rect x="148" y="242" width="160" height="4" rx="2"
          fill="#FFF0A0" opacity="0.5"/>
    <!-- Guard end ornaments -->
    <ellipse cx="152" cy="251" rx="8" ry="9" fill="url(#goldMain)"/>
    <ellipse cx="304" cy="251" rx="8" ry="9" fill="url(#goldMain)"/>
    <ellipse cx="152" cy="251" rx="4" ry="4" fill="url(#gemRed)"/>
    <ellipse cx="304" cy="251" rx="4" ry="4" fill="url(#gemRed)"/>

    <!-- Grip / handle -->
    <rect x="221" y="260" width="14" height="88" rx="3"
          fill="#4A2E0E"/>
    <!-- Grip wrapping lines -->
    <line x1="221" y1="272" x2="235" y2="272" stroke="#C9A84C" stroke-width="2" opacity="0.7"/>
    <line x1="221" y1="284" x2="235" y2="284" stroke="#C9A84C" stroke-width="2" opacity="0.7"/>
    <line x1="221" y1="296" x2="235" y2="296" stroke="#C9A84C" stroke-width="2" opacity="0.7"/>
    <line x1="221" y1="308" x2="235" y2="308" stroke="#C9A84C" stroke-width="2" opacity="0.7"/>
    <line x1="221" y1="320" x2="235" y2="320" stroke="#C9A84C" stroke-width="2" opacity="0.7"/>
    <line x1="221" y1="332" x2="235" y2="332" stroke="#C9A84C" stroke-width="2" opacity="0.7"/>

    <!-- Pommel -->
    <ellipse cx="228" cy="358" rx="18" ry="16" fill="url(#goldMain)"/>
    <ellipse cx="228" cy="356" rx="8"  ry="6"  fill="url(#gemRed)"/>
    <ellipse cx="225" cy="353" rx="3"  ry="2"  fill="#FF9090" opacity="0.6"/>
  </g>

  <!-- ═══════════════════════════════════════════
       STAR / GLOW accents (corner sparkles)
       ═══════════════════════════════════════════ -->
  <g fill="#F5D98B" opacity="0.55">
    <!-- Small 4-point stars at corners of safe zone -->
    <polygon points="100,100 103,108 111,108 105,113 107,121 100,116 93,121 95,113 89,108 97,108" transform="scale(0.6) translate(70,70)"/>
    <polygon points="356,100 359,108 367,108 361,113 363,121 356,116 349,121 351,113 345,108 353,108" transform="scale(0.6) translate(-68,70)"/>
  </g>
</svg>
